version: '3.8'

services:

  db_schedule:
    container_name: db_schedule_dev
    image: postgres:13-alpine
    volumes:
      - postgres_schedule_data:/var/lib/postgresql/data/
    environment:
      - POSTGRES_DB=${DB_NAME}
      - POSTGRES_USER=${DB_USER}
      - POSTGRES_PASSWORD=${DB_PASSWD}
    env_file:
      - ./.env
    ports:
      - "5435:5432"

  web_schedule:
    container_name: therapy_scheduler
    image: therapy_dev_img
    build: .
    tty: true
    volumes:
      - .:/app
    ports:
      - 8000:8000
    env_file:
      - ./.env

volumes:
  postgres_schedule_data: