{% extends 'bases/index.html' %}
{% block content %}
  <h2>Confirm Deletion</h2>
  <p>Are you sure you want to delete the appointment for {{ appointment.client }} with {{ appointment.therapist }}?</p>
  <form method="post">
    {% csrf_token %}
    <button type="submit" class="btn btn-danger">Delete</button>
    <a href="{% url 'appointment-detail' appointment.pk %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
