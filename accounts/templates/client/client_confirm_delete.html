
{% block content %}
  <h2>Delete Client</h2>
  <p>Are you sure you want to delete {{ client.name }}?</p>
  <form method="post">
    {% csrf_token %}
    <input type="submit" class="btn btn-danger" value="Yes, Delete">
    <a href="{% url 'client_list' %}" class="btn btn-secondary">Cancel</a>
  </form>
{% endblock %}
