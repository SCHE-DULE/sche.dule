
{% load static %}

{% block content %}
    <h2>List of Clients</h2>
    <ul>
        {% for client in clients %}
            <li><a href="{% url 'client_detail' client.pk %}">{{ client.name }}</a></li>
        {% empty %}
            <li>No clients available.</li>
        {% endfor %}
    </ul>
    <a href="{% url 'client_create' %}" class="btn btn-primary">Create New Client</a>
{% endblock %}
