[tool.poetry]
name = "sche-dule"
version = "0.1.0"
description = ""
authors = ["Ícaro Abreu, Bruno Portugal"]
readme = "README.md"
packages = [{include = "sche"}]

[tool.poetry.dependencies]
python = "^3.8"
django = "^4.2.6"
pillow = "^10.1.0"
asgiref = "^3.7.2"
cffi = "^1.16.0"
cssselect2 = "^0.7.0"
fonttools = "^4.43.1"
html5lib = "^1.1"
pip = "^23.3"
pycparser = "^2.21"
pydyf = "^0.8.0"
pyphen = "^0.14.0"
setuptools = "^68.2.2"
six = "^1.16.0"
sqlparse = "^0.4.4"
tinycss2 = "^1.2.1"
tzdata = "^2023.3"
weasyprint = "^60.1"
webencodings = "^0.5.1"
zopfli = "^0.2.3"
unidecode = "^1.3.7"
django-sass-processor = "^1.2.2"
faker = "^19.10.0"
djangorestframework = "^3.14.0"
python-decouple = "^3.8"
dj-database-url = "^2.1.0"
psycopg2-binary = "^2.9.9"
django-tenants = "^3.5.0"

[tool.poetry.group.dev]
optional = true
[tool.poetry.group.dev.dependencies]
django-extensions = "^3.2.3"
werkzeug = "^3.0.1"

[tool.poetry.group.homolog]
optional = true
[tool.poetry.group.homolog.dependencies]
django-compressor = "^4.4"


[build-system]
requires = ["poetry-core"]
build-backend = "poetry.core.masonry.api"
